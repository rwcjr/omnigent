name: PR Template

# Validates that a PR description follows .github/pull_request_template.md
# (Summary, Test Plan, Type of change, Test coverage, and a well-formed
# Changelog section) via .github/scripts/pr-template/validate.py.
#
# Scoped to SAME-REPO PRs on purpose. This check was previously removed
# because it blocked every fork PR -- outside contributors can't be expected
# to match the structured template. Fork PRs and dependabot are skipped here
# (the job still reports success so it never gates them). It is intentionally
# NOT in the Merge Ready required list, so it surfaces as an advisory signal
# for internal PRs without hard-blocking merge.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR Template
    # Skip drafts (still a work in progress) and fork PRs / dependabot, whose
    # bodies can't be held to the internal template.
    if: >-
      !github.event.pull_request.draft &&
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts/pr-template
          persist-credentials: false

      - name: Fall back to PR branch validator
        if: ${{ hashFiles('.github/scripts/pr-template/validate.py') == '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: .github/scripts/pr-template
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: ".python-version"

      - name: Validate PR description follows template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/pr-template/validate.py
